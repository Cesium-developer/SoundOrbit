plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.cesiumdeveloper.soundorbit'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'io.github.cesiumdeveloper.soundorbit'
        minSdk 29
        targetSdk 34
        versionCode 105
        versionName '0.1.5'
    }

    signingConfigs {
        release {
            // CI 从 GitHub Secrets 注入；本地未配置时为空，构建退化为 debug 签名
            def ks = System.getenv("SIGN_KEYSTORE")
            if (ks != null && ks != "") {
                storeFile file(ks)
                storePassword System.getenv("SIGN_STORE_PASSWORD")
                keyAlias System.getenv("SIGN_KEY_ALIAS")
                keyPassword System.getenv("SIGN_KEY_PASSWORD")
            }
        }
    }

    // 发布构建跳过 lint（CI 无需下载 lint-gradle 依赖；本地可用 ./gradlew lint 单独检查）
    lint {
        checkReleaseBuilds false
    }

    buildTypes {
        debug {
            // 测试包用独立包名，可与正式版共存，便于长期真机验证
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
            // 仅当 CI 注入签名密钥时用正式签名；本地无密钥则构建 unsigned（可自行签名）
            def ks = System.getenv("SIGN_KEYSTORE")
            if (ks != null && ks != "") {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.6.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // appcompat 1.7 自带 kotlin-stdlib 1.8，统一旧传递依赖避免重复类
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'

    testImplementation 'junit:junit:4.13.2'
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
