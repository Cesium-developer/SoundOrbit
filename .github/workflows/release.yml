name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGN_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/soundorbit-release.jks"
          test -s "$RUNNER_TEMP/soundorbit-release.jks"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # 标准 semver：versionCode = MAJOR*10000 + MINOR*100 + PATCH
          # 单调递增、无碰撞，各段需 < 100
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          if ! [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "tag 不是标准的 MAJOR.MINOR.PATCH 格式: $VERSION" >&2
            exit 1
          fi
          if (( MAJOR >= 100 || MINOR >= 100 || PATCH >= 100 )); then
            echo "版本号各段必须小于 100: $VERSION" >&2
            exit 1
          fi
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "versionName=$VERSION versionCode=$CODE"
          sed -i "s/versionCode [0-9]*/versionCode $CODE/" app/build.gradle
          sed -i "s/versionName '[^']*'/versionName '$VERSION'/" app/build.gradle

      - name: Build signed release APK
        env:
          SIGN_KEYSTORE: ${{ runner.temp }}/soundorbit-release.jks
          SIGN_STORE_PASSWORD: ${{ secrets.SIGN_STORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/release/app-release.apk

      - name: Rename APK with tag
        run: cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/SoundOrbit-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/SoundOrbit-*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
